services:
  wekode.mml.media:
    image: ${IMAGE}
    build:
      context: .
      dockerfile: Media.API/Dockerfile
      args:
       - UID=${UID}
       - GID=${GID}
       - DOT_NET_BUILD_CONFIG=${DOT_NET_BUILD_CONFIG}
    container_name: wekode.mml.media
    restart: always
    user: ${UID}:${GID}
    environment:
      INSTANCE: ${INSTANCE}
      FEDERATION_KEY_SECRET: ${FEDERATION_KEY_SECRET:-}
      FEDERATION_KEY_SECRET_FILE: /run/secrets/federation_key_secret
    volumes:
      - ${VOL_CERTS}:/etc/ssl/certs:ro,z
      - ${VOL_RECORDS}:/records:Z
      - ${APPSETTINGS}:/configs/appsettings.json:ro,Z
      - ${MEDIA_SECRETS_PATH:-./secrets}:/secrets
      # optional secret file, /dev/null if not configured
      - ${FEDERATION_KEY_SECRET_FILE:-/dev/null}:/run/secrets/federation_key_secret:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - wekode.mml
    logging:
      driver: "json-file"
      options:
        mode: "non-blocking"
        max-size: "${LOG_MAX_SIZE}"
        max-file: "${LOG_MAX_FILE}"

networks:
  wekode.mml:
    external: true
